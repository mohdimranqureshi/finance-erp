# Security defaults, loaded by SecurityConfig via @PropertySource with lower precedence than application*.yml
# and environment variables, so profiles (see application-prod.yml) override them.

# Sessions live in the embedded Tomcat's memory: single instance only, and a restart signs everyone out.
# Add Spring Session (JDBC/Redis) before running more than one instance.
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=false

# HTTP Basic is kept for API clients and tests; it is refused for MFA-enabled and disabled accounts.
app.security.basic-auth-enabled=true
# Base64 of 32 random bytes (AES-256-GCM key for TOTP secrets at rest), e.g. `openssl rand -base64 32`.
app.security.mfa-encryption-key=${MFA_ENCRYPTION_KEY:}
# Without a key, local/test runs use a throwaway key (loud warning). The prod profile sets false: startup fails.
app.security.mfa-allow-ephemeral-key=true
app.security.mfa-issuer=${MFA_ISSUER:FinoraAI}
# Hard limit on a browser session regardless of activity (idle timeout above is 30 minutes).
app.security.session-absolute-timeout=12h
