server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
spring:
  profiles:
    default: local
  application:
    name: finance-erp
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  registration:
    enabled: true
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    display-name: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:Finance ERP Administrator}
