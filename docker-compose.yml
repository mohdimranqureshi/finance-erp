services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_erp
      POSTGRES_USER: finance_erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - finance_erp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_erp -d finance_erp"]
      interval: 5s
      timeout: 3s
      retries: 20
  # Run with: docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build: .
    container_name: finora-ai
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/finance_erp
      DB_USERNAME: finance_erp
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
volumes:
  finance_erp_pgdata:
